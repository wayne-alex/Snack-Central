<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAVI Delivery - Dispatcher Dashboard</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #10B981;
            --primary-orange: #F59E0B;
            --accent-blue: #1E40AF;
            --light-cream: #FEFCE8;
            --dark-text: #1F2937;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-600: #6B7280;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --info: #3B82F6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--gray-50);
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 260px;
            background: white;
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.05);
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-green);
            text-decoration: none;
        }

        .sidebar.collapsed .brand-text {
            display: none;
        }

        .sidebar-toggle {
            background: var(--gray-100);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--dark-text);
            transition: all 0.2s;
        }

        .sidebar-toggle:hover {
            background: var(--gray-200);
            transform: rotate(180deg);
        }

        .sidebar-menu {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem;
            border-radius: 10px;
            color: var(--gray-600);
            text-decoration: none;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .menu-item:hover {
            background: var(--gray-100);
            color: var(--dark-text);
            transform: translateX(5px);
        }

        .menu-item.active {
            background: linear-gradient(135deg, var(--primary-green), var(--primary-orange));
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .menu-icon {
            width: 20px;
            text-align: center;
            font-size: 1.25rem;
            transition: transform 0.2s;
        }

        .menu-item:hover .menu-icon {
            transform: scale(1.1);
        }

        .sidebar.collapsed .menu-text {
            display: none;
        }

        .sidebar.collapsed .menu-item {
            justify-content: center;
            padding: 0.875rem;
        }

        .menu-badge {
            position: absolute;
            right: 1rem;
            background: var(--danger);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 24px;
            text-align: center;
        }

        .sidebar.collapsed .menu-badge {
            top: 0.25rem;
            right: 0.25rem;
            padding: 0.15rem 0.3rem;
            font-size: 0.65rem;
        }

        .sidebar-footer {
            padding: 1rem;
            border-top: 1px solid var(--gray-200);
            background: white;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 10px;
            background: var(--gray-50);
            transition: all 0.2s;
            cursor: pointer;
        }

        .user-profile:hover {
            background: var(--gray-100);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-green), var(--primary-orange));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .sidebar.collapsed .user-info {
            display: none;
        }

        .user-name {
            font-weight: 600;
            color: var(--dark-text);
            font-size: 0.9rem;
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--gray-600);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
        }

        .sidebar.collapsed ~ .main-content {
            margin-left: 80px;
        }

        /* Top Bar */
        .top-bar {
            background: white;
            border-bottom: 1px solid var(--gray-200);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-text);
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .action-btn {
            background: var(--gray-100);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark-text);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--gray-200);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: white;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border: 2px solid white;
        }

        /* Mobile Menu Button */
        .mobile-menu-btn {
            display: none;
            background: var(--gray-100);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--dark-text);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--gray-200);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-green), var(--primary-orange));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .stat-icon.pending {
            background: linear-gradient(135deg, #F59E0B, #D97706);
        }

        .stat-icon.preparing {
            background: linear-gradient(135deg, #3B82F6, #2563EB);
        }

        .stat-icon.delivery {
            background: linear-gradient(135deg, #10B981, #059669);
        }

        .stat-icon.completed {
            background: linear-gradient(135deg, #8B5CF6, #7C3AED);
        }

        .stat-trend {
            font-size: 0.875rem;
            font-weight: 600;
        }

        .stat-trend.up {
            color: var(--success);
        }

        .stat-trend.down {
            color: var(--danger);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark-text);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        /* Orders Section */
        .orders-section {
            padding: 0 2rem 2rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark-text);
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            background: white;
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--gray-200);
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--gray-600);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-tab:hover {
            background: var(--gray-100);
        }

        .filter-tab.active {
            background: var(--primary-green);
            color: white;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        .orders-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
        }

        /* Order Card */
        .order-card {
            background: white;
            border-radius: 16px;
            border: 1px solid var(--gray-200);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: cardAppear 0.5s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .order-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .order-header {
            padding: 1.25rem;
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .order-number {
            font-weight: 700;
            color: var(--dark-text);
            font-size: 1.1rem;
        }

        .order-time {
            font-size: 0.875rem;
            color: var(--gray-600);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-badge.pending {
            background: #FEF3C7;
            color: #92400E;
        }

        .status-badge.pending::before {
            background: #D97706;
        }

        .status-badge.confirmed {
            background: #DBEAFE;
            color: #1E3A8A;
        }

        .status-badge.confirmed::before {
            background: #2563EB;
        }

        .status-badge.preparing {
            background: #E0E7FF;
            color: #3730A3;
        }

        .status-badge.preparing::before {
            background: #4F46E5;
        }

        .status-badge.ready {
            background: #D1FAE5;
            color: #065F46;
        }

        .status-badge.ready::before {
            background: #10B981;
        }

        .status-badge.assigned {
            background: #E0E7FF;
            color: #3730A3;
        }

        .status-badge.assigned::before {
            background: #4F46E5;
        }

        .status-badge.in-transit {
            background: #DBEAFE;
            color: #1E3A8A;
        }

        .status-badge.in-transit::before {
            background: #2563EB;
        }

        .status-badge.delivered {
            background: #D1FAE5;
            color: #065F46;
        }

        .status-badge.delivered::before {
            background: #10B981;
        }

        .status-badge.cancelled {
            background: #FEE2E2;
            color: #991B1B;
        }

        .status-badge.cancelled::before {
            background: #DC2626;
        }

        .order-body {
            padding: 1.25rem;
        }

        .order-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .info-item {
            display: flex;
            align-items: start;
            gap: 0.75rem;
        }

        .info-icon {
            width: 36px;
            height: 36px;
            background: var(--light-cream);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-green);
            flex-shrink: 0;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--gray-600);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-size: 0.95rem;
            color: var(--dark-text);
            font-weight: 500;
        }

        .order-items {
            background: var(--gray-50);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.25rem;
        }

        .order-items-header {
            font-weight: 600;
            color: var(--dark-text);
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        .item-name {
            flex: 1;
        }

        .item-price {
            font-weight: 600;
            color: var(--dark-text);
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            padding-top: 0.75rem;
            border-top: 2px dashed var(--gray-200);
            font-weight: 700;
            color: var(--dark-text);
        }

        .order-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn-action {
            flex: 1;
            min-width: 120px;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-confirm {
            background: var(--primary-green);
            color: white;
        }

        .btn-confirm:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-assign {
            background: var(--primary-orange);
            color: white;
        }

        .btn-assign:hover {
            background: #D97706;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .btn-cancel {
            background: var(--gray-200);
            color: var(--dark-text);
        }

        .btn-cancel:hover {
            background: var(--danger);
            color: white;
            transform: translateY(-2px);
        }

        .btn-view {
            background: var(--info);
            color: white;
        }

        .btn-view:hover {
            background: #2563EB;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        /* Assign Rider Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 1rem;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlide 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-text);
        }

        .close-modal {
            background: var(--gray-100);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--dark-text);
            transition: all 0.2s;
        }

        .close-modal:hover {
            background: var(--gray-200);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .rider-card {
            background: var(--gray-50);
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .rider-card:hover {
            border-color: var(--primary-green);
            transform: translateY(-2px);
        }

        .rider-card.selected {
            border-color: var(--primary-green);
            background: var(--light-cream);
        }

        .rider-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-green), var(--primary-orange));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .rider-info {
            flex: 1;
        }

        .rider-name {
            font-weight: 700;
            color: var(--dark-text);
            margin-bottom: 0.25rem;
        }

        .rider-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--gray-600);
            flex-wrap: wrap;
        }

        .rider-status {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-dot.busy {
            background: var(--warning);
        }

        .rider-check {
            color: var(--primary-green);
            font-size: 1.5rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .rider-card.selected .rider-check {
            opacity: 1;
        }

        .modal-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--gray-200);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* Sound Animation */
        .new-order-alert {
            position: fixed;
            top: 100px;
            right: 20px;
            background: linear-gradient(135deg, var(--primary-green), var(--primary-orange));
            color: white;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            animation: slideInRight 0.5s, shake 0.5s 0.5s 3;
            z-index: 10001;
            display: none;
            max-width: 400px;
            width: calc(100% - 40px);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 16px;
            border: 2px dashed var(--gray-200);
        }

        .empty-icon {
            font-size: 4rem;
            color: var(--gray-600);
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-text);
            margin-bottom: 0.5rem;
        }

        .empty-desc {
            color: var(--gray-600);
            max-width: 400px;
            margin: 0 auto;
        }

        /* Loader */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--gray-200);
            border-radius: 50%;
            border-top-color: var(--primary-green);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 10002;
            animation: slideUp 0.3s ease-out;
            max-width: 400px;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }

        .toast.success .toast-icon {
            background: var(--success);
        }

        .toast.error .toast-icon {
            background: var(--danger);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .orders-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0 !important;
            }

            .mobile-menu-btn {
                display: flex;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
                padding: 1rem;
            }

            .orders-section {
                padding: 0 1rem 1rem;
            }

            .order-info-grid {
                grid-template-columns: 1fr;
            }

            .order-actions {
                flex-direction: column;
            }

            .btn-action {
                width: 100%;
            }

            .top-bar {
                padding: 1rem;
                flex-wrap: wrap;
                gap: 1rem;
            }

            .page-title {
                font-size: 1.25rem;
            }

            .modal-footer {
                flex-direction: column;
            }

            .filter-tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
                justify-content: flex-start;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filter-tabs {
                width: 100%;
                justify-content: flex-start;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .stat-card {
                padding: 1.25rem;
            }

            .stat-value {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="#" class="sidebar-brand">

</div>

<!-- Main Content -->
<div class="main-content">

    <div class="top-bar">
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">

        <h1 class="page-title">Order Management</h1>

    <!-- Stats Grid -->

        <div class="stat-card">

    <!-- Orders Section -->
    <div class="orders-section">

                <button class="filter-tab" onclick="filterOrders('pending')">Pending</button>
                <button class="filter-tab" onclick="filterOrders('preparing')">Preparing</button>

                <button class="filter-tab" onclick="filterOrders('completed')">Completed</button>

</div>

<!-- Assign Rider Modal -->
<div class="modal-overlay" id="assignRiderModal">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">Assign Rider</h3>

                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <p style="color: var(--gray-600); margin-bottom: 1.5rem;">Select an available rider for order <strong
                    id="assignOrderNumber"></strong></p>

            <div id="ridersContainer">
                <!-- Riders will be dynamically inserted -->
            </div>
        </div>

            <button class="btn-action btn-confirm" onclick="confirmAssignment()">

<!-- New Order Alert -->
<div class="new-order-alert" id="newOrderAlert">
    <div style="display: flex; align-items: center; gap: 1rem;">
        <i class="fas fa-bell" style="font-size: 1.5rem;"></i>
        <div>
            <div style="font-weight: 700; font-size: 1rem;">New Order Received!</div>
            <div style="font-size: 0.875rem; opacity: 0.9;" id="newOrderMessage"></div>
        </div>
    </div>
</div>

<script>
    // Sample data for orders
    const orders = [
        {
            id: "ORD-001",
            customer: "Jane Smith",
            address: "123 Main St, Nairobi",
            phone: "+254 712 345 678",
            time: "10:30 AM",
            status: "pending",
            items: [
                {name: "Chicken Burger", price: 850},
                {name: "French Fries", price: 350},
                {name: "Soda", price: 150}
            ],
            total: 1350,
            eta: "30-45 min"
        },
        {
            id: "ORD-002",
            customer: "Mike Johnson",
            address: "456 Park Ave, Mombasa",
            phone: "+254 723 456 789",
            time: "11:15 AM",
            status: "preparing",
            items: [
                {name: "Pizza Large", price: 1200},
                {name: "Garlic Bread", price: 400}
            ],
            total: 1600,
            eta: "20-30 min"
        },
        {
            id: "ORD-003",
            customer: "Sarah Williams",
            address: "789 Hill Rd, Kisumu",
            phone: "+254 734 567 890",
            time: "11:45 AM",
            status: "assigned",
            items: [
                {name: "Vegetable Salad", price: 600},
                {name: "Fruit Juice", price: 250}
            ],
            total: 850,
            rider: "David M.",
            eta: "15-25 min"
        },
        {
            id: "ORD-004",
            customer: "Robert Brown",
            address: "321 Lake View, Nakuru",
            phone: "+254 745 678 901",
            time: "12:00 PM",
            status: "in-transit",
            items: [
                {name: "Steak Dinner", price: 2100},
                {name: "Wine", price: 800},
                {name: "Dessert", price: 450}
            ],
            total: 3350,
            rider: "Peter K.",
            eta: "5-10 min"
        },
        {
            id: "ORD-005",
            customer: "Lisa Davis",
            address: "654 Mountain Rd, Eldoret",
            phone: "+254 756 789 012",
            time: "12:30 PM",
            status: "delivered",
            items: [
                {name: "Pasta", price: 750},
                {name: "Garlic Bread", price: 400}
            ],
            total: 1150,
            rider: "James W."
        }
    ];

    // Sample data for riders
    const riders = [
        {id: 1, name: "David M.", status: "available", rating: 4.8, deliveries: 124, avatar: "DM"},
        {id: 2, name: "Peter K.", status: "busy", rating: 4.6, deliveries: 89, avatar: "PK"},
        {id: 3, name: "James W.", status: "available", rating: 4.9, deliveries: 156, avatar: "JW"},
        {id: 4, name: "Samuel T.", status: "available", rating: 4.7, deliveries: 102, avatar: "ST"},
        {id: 5, name: "Michael B.", status: "available", rating: 4.5, deliveries: 78, avatar: "MB"}
    ];

    // Global variables
    let currentOrderToAssign = null;
    let selectedRiderId = null;
    let currentFilter = 'all';

    // Initialize dashboard
    document.addEventListener('DOMContentLoaded', function () {
        updateStats();
        renderOrders(orders);
        setupEventListeners();

        // Simulate new order notification after 3 seconds
        setTimeout(() => {
            simulateNewOrder();
        }, 3000);

        // Simulate periodic updates
        setInterval(updateOrderStatuses, 30000);
    });

    // Update statistics
    function updateStats() {
        const pendingCount = orders.filter(o => o.status === 'pending').length;
        const preparingCount = orders.filter(o => o.status === 'preparing').length;
        const deliveryCount = orders.filter(o => o.status === 'in-transit').length;
        const completedCount = orders.filter(o => o.status === 'delivered').length;

        document.getElementById('pendingCount').textContent = pendingCount;
        document.getElementById('preparingCount').textContent = preparingCount;
        document.getElementById('deliveryCount').textContent = deliveryCount;
        document.getElementById('completedCount').textContent = completedCount;

        // Update menu badge
        const orderBadge = document.querySelector('.menu-badge');
        if (orderBadge) {
            orderBadge.textContent = pendingCount;
        }
    }

    // Render orders
    function renderOrders(ordersToRender) {
        const ordersGrid = document.getElementById('ordersGrid');
        ordersGrid.innerHTML = '';

        if (ordersToRender.length === 0) {
            ordersGrid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <h3 class="empty-title">No Orders Found</h3>
                    <p class="empty-desc">There are no orders matching your current filter.</p>
                </div>
            `;
            return;
        }

        ordersToRender.forEach(order => {
            const orderCard = createOrderCard(order);
            ordersGrid.appendChild(orderCard);
        });
    }

    // Create order card HTML
    function createOrderCard(order) {
        const card = document.createElement('div');
        card.className = 'order-card';
        card.id = `order-${order.id}`;

        // Format items HTML
        const itemsHtml = order.items.map(item => `
            <div class="item-row">
                <span class="item-name">${item.name}</span>
                <span class="item-price">KSh ${item.price}</span>
            </div>
        `).join('');

        // Status badge class
        const statusClass = order.status === 'in-transit' ? 'in-transit' : order.status;

        // Action buttons based on status
        let actionButtons = '';
        if (order.status === 'pending') {
            actionButtons = `
                <button class="btn-action btn-confirm" onclick="confirmOrder('${order.id}')">
                    <i class="fas fa-check"></i> Confirm
                </button>
                <button class="btn-action btn-cancel" onclick="cancelOrder('${order.id}')">
                    <i class="fas fa-times"></i> Cancel
                </button>
            `;
        } else if (order.status === 'preparing') {
            actionButtons = `
                <button class="btn-action btn-assign" onclick="openAssignModal('${order.id}')">
                    <i class="fas fa-motorcycle"></i> Assign Rider
                </button>
                <button class="btn-action btn-cancel" onclick="cancelOrder('${order.id}')">
                    <i class="fas fa-times"></i> Cancel
                </button>
            `;
        } else if (order.status === 'assigned') {
            actionButtons = `
                <button class="btn-action btn-confirm" onclick="markAsInTransit('${order.id}')">
                    <i class="fas fa-shipping-fast"></i> Start Delivery
                </button>
                <button class="btn-action btn-view" onclick="viewOrderDetails('${order.id}')">
                    <i class="fas fa-eye"></i> View
                </button>
            `;
        } else if (order.status === 'in-transit') {
            actionButtons = `
                <button class="btn-action btn-confirm" onclick="markAsDelivered('${order.id}')">
                    <i class="fas fa-check-circle"></i> Mark Delivered
                </button>
                <button class="btn-action btn-view" onclick="viewOrderDetails('${order.id}')">
                    <i class="fas fa-eye"></i> View
                </button>
            `;
        } else {
            actionButtons = `
                <button class="btn-action btn-view" onclick="viewOrderDetails('${order.id}')">
                    <i class="fas fa-eye"></i> View Details
                </button>
                <button class="btn-action btn-cancel" onclick="reorder('${order.id}')">
                    <i class="fas fa-redo"></i> Reorder
                </button>
            `;
        }

        card.innerHTML = `
            <div class="order-header">
                <div>
                    <div class="order-number">${order.id}</div>
                    <div class="order-time">
                        <i class="far fa-clock"></i> ${order.time}
                    </div>
                </div>
                <div class="status-badge ${statusClass}">
                    ${order.status.replace('-', ' ')}
                </div>
            </div>
            <div class="order-body">
                <div class="order-info-grid">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="info-content">
                            <div class="info-label">Customer</div>
                            <div class="info-value">${order.customer}</div>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                        <div class="info-content">
                            <div class="info-label">Address</div>
                            <div class="info-value">${order.address}</div>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="fas fa-phone"></i>
                        </div>
                        <div class="info-content">
                            <div class="info-label">Phone</div>
                            <div class="info-value">${order.phone}</div>
                        </div>
                    </div>
                    ${order.rider ? `
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="fas fa-motorcycle"></i>
                        </div>
                        <div class="info-content">
                            <div class="info-label">Rider</div>
                            <div class="info-value">${order.rider}</div>
                        </div>
                    </div>
                    ` : ''}
                </div>

                <div class="order-items">
                    <div class="order-items-header">Order Items</div>
                    ${itemsHtml}
                    <div class="order-total">
                        <span>Total Amount</span>
                        <span>KSh ${order.total}</span>
                    </div>
                </div>

                ${order.eta ? `
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem; padding: 0.75rem; background: var(--light-cream); border-radius: 8px;">
                    <i class="fas fa-clock" style="color: var(--primary-orange);"></i>
                    <span style="font-weight: 600; color: var(--dark-text);">Estimated Delivery:</span>
                    <span style="color: var(--primary-green); font-weight: 700;">${order.eta}</span>
                </div>
                ` : ''}

                <div class="order-actions">
                    ${actionButtons}
                </div>
            </div>
        `;

        return card;
    }

    // Filter orders
    function filterOrders(filter) {
        currentFilter = filter;

        // Update active tab
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        event.target.classList.add('active');

        let filteredOrders;
        if (filter === 'all') {
            filteredOrders = orders;
        } else if (filter === 'delivery') {
            filteredOrders = orders.filter(o => o.status === 'in-transit');
        } else {
            filteredOrders = orders.filter(o => o.status === filter);
        }

        renderOrders(filteredOrders);
    }

    // Open assign rider modal
    function openAssignModal(orderId) {
        currentOrderToAssign = orderId;
        const order = orders.find(o => o.id === orderId);

        if (!order) return;

        document.getElementById('assignOrderNumber').textContent = orderId;
        selectedRiderId = null;

        // Render riders
        const ridersContainer = document.getElementById('ridersContainer');
        ridersContainer.innerHTML = '';

        riders.forEach(rider => {
            const riderCard = document.createElement('div');
            riderCard.className = 'rider-card';
            if (rider.status === 'busy') {
                riderCard.classList.add('busy');
            }
            riderCard.onclick = () => selectRider(rider.id);

            riderCard.innerHTML = `
                <div class="rider-avatar">${rider.avatar}</div>
                <div class="rider-info">
                    <div class="rider-name">${rider.name}</div>
                    <div class="rider-meta">
                        <span class="rider-status">
                            <span class="status-dot ${rider.status === 'busy' ? 'busy' : ''}"></span>
                            ${rider.status === 'available' ? 'Available' : 'Currently Busy'}
                        </span>
                        <span><i class="fas fa-star"></i> ${rider.rating}</span>
                        <span><i class="fas fa-shipping-fast"></i> ${rider.deliveries} deliveries</span>
                    </div>
                </div>
                <div class="rider-check">
                    <i class="fas fa-check-circle"></i>
                </div>
            `;

            ridersContainer.appendChild(riderCard);
        });

        document.getElementById('assignRiderModal').classList.add('show');
    }

    // Select rider in modal
    function selectRider(riderId) {
        selectedRiderId = riderId;

        // Update UI
        document.querySelectorAll('.rider-card').forEach(card => {
            card.classList.remove('selected');
        });

        const selectedCard = document.querySelector(`.rider-card:nth-child(${riders.findIndex(r => r.id === riderId) + 1})`);
        if (selectedCard) {
            selectedCard.classList.add('selected');
        }
    }

    // Confirm rider assignment
    function confirmAssignment() {
        if (!currentOrderToAssign || !selectedRiderId) {
            showToast('Please select a rider', 'error');
            return;
        }

        const orderIndex = orders.findIndex(o => o.id === currentOrderToAssign);
        const rider = riders.find(r => r.id === selectedRiderId);

        if (orderIndex !== -1 && rider) {
            orders[orderIndex].status = 'assigned';
            orders[orderIndex].rider = rider.name;

            // Update order card
            const orderCard = document.getElementById(`order-${currentOrderToAssign}`);
            if (orderCard) {
                orderCard.remove();
                setTimeout(() => {
                    renderOrders(currentFilter === 'all' ? orders :
                        orders.filter(o => o.status === currentFilter));
                }, 100);
            }

            updateStats();
            showToast(`Rider ${rider.name} assigned to order ${currentOrderToAssign}`, 'success');
        }

        closeAssignModal();
    }

    // Close assign modal
    function closeAssignModal() {
        document.getElementById('assignRiderModal').classList.remove('show');
        currentOrderToAssign = null;
        selectedRiderId = null;
    }

    // Order actions
    function confirmOrder(orderId) {
        const orderIndex = orders.findIndex(o => o.id === orderId);
        if (orderIndex !== -1) {
            orders[orderIndex].status = 'preparing';

            // Update UI
            const orderCard = document.getElementById(`order-${orderId}`);
            if (orderCard) {
                orderCard.remove();
                setTimeout(() => {
                    renderOrders(currentFilter === 'all' ? orders :
                        orders.filter(o => o.status === currentFilter));
                }, 100);
            }

            updateStats();
            showToast(`Order ${orderId} confirmed and moved to preparing`, 'success');
        }
    }

    function cancelOrder(orderId) {
        if (confirm(`Are you sure you want to cancel order ${orderId}?`)) {
            const orderIndex = orders.findIndex(o => o.id === orderId);
            if (orderIndex !== -1) {
                orders[orderIndex].status = 'cancelled';

                // Update UI
                const orderCard = document.getElementById(`order-${orderId}`);
                if (orderCard) {
                    orderCard.remove();
                    setTimeout(() => {
                        renderOrders(currentFilter === 'all' ? orders :
                            orders.filter(o => o.status === currentFilter));
                    }, 100);
                }

                updateStats();
                showToast(`Order ${orderId} has been cancelled`, 'error');
            }
        }
    }

    function markAsInTransit(orderId) {
        const orderIndex = orders.findIndex(o => o.id === orderId);
        if (orderIndex !== -1) {
            orders[orderIndex].status = 'in-transit';

            // Update UI
            const orderCard = document.getElementById(`order-${orderId}`);
            if (orderCard) {
                orderCard.remove();
                setTimeout(() => {
                    renderOrders(currentFilter === 'all' ? orders :
                        orders.filter(o => o.status === currentFilter));
                }, 100);
            }

            updateStats();
            showToast(`Order ${orderId} is now in transit`, 'success');
        }
    }

    function markAsDelivered(orderId) {
        const orderIndex = orders.findIndex(o => o.id === orderId);
        if (orderIndex !== -1) {
            orders[orderIndex].status = 'delivered';
            delete orders[orderIndex].eta;

            // Update UI
            const orderCard = document.getElementById(`order-${orderId}`);
            if (orderCard) {
                orderCard.remove();
                setTimeout(() => {
                    renderOrders(currentFilter === 'all' ? orders :
                        orders.filter(o => o.status === currentFilter));
                }, 100);
            }

            updateStats();
            showToast(`Order ${orderId} marked as delivered`, 'success');
        }
    }

    function viewOrderDetails(orderId) {
        const order = orders.find(o => o.id === orderId);
        if (order) {
            alert(`Order Details:\n\nID: ${order.id}\nCustomer: ${order.customer}\nStatus: ${order.status}\nTotal: KSh ${order.total}\n\nFull details would open in a detailed view.`);
        }
    }

    function reorder(orderId) {
        showToast(`Creating a new order based on ${orderId}`, 'success');
    }

    // Toggle sidebar
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
    }

    // Toggle mobile menu
    function toggleMobileMenu() {
        document.getElementById('sidebar').classList.toggle('show');
    }

    // Show section
    function showSection(sectionId) {
        // Update active menu item
        document.querySelectorAll('.menu-item').forEach(item => {
            item.classList.remove('active');
        });
        event.target.classList.add('active');

        // Update page title based on section
        const titles = {
            dashboard: 'Dashboard Overview',
            orders: 'Order Management',
            riders: 'Rider Management',
            analytics: 'Analytics & Reports',
            settings: 'Settings'
        };

        document.querySelector('.page-title').textContent = titles[sectionId] || 'EAVI Delivery';

        // In a real app, you would load different content for each section
        // For now, we just update the title
    }

    // Show notifications
    function showNotifications() {
        alert(`You have 3 notifications:\n\n1. New order ORD-006 received\n2. Rider David M. is running late\n3. System maintenance scheduled for tonight`);
    }

    // Refresh orders
    function refreshOrders() {
        const refreshBtn = event.target.closest('.action-btn');
        refreshBtn.innerHTML = '<div class="loader"></div>';

        setTimeout(() => {
            refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i>';
            showToast('Orders refreshed successfully', 'success');
        }, 1000);
    }

    // Simulate new order notification
    function simulateNewOrder() {
        const newOrder = {
            id: `ORD-00${orders.length + 1}`,
            customer: "Emma Wilson",
            address: "987 Valley Rd, Thika",
            phone: "+254 767 890 123",
            time: "1:15 PM",
            status: "pending",
            items: [
                {name: "Fish & Chips", price: 950},
                {name: "Coleslaw", price: 200}
            ],
            total: 1150,
            eta: "25-35 min"
        };

        orders.unshift(newOrder);

        // Show notification
        document.getElementById('newOrderMessage').textContent = `Order ${newOrder.id} from ${newOrder.customer} for KSh ${newOrder.total}`;
        const alert = document.getElementById('newOrderAlert');
        alert.classList.add('show');

        // Play notification sound (if allowed)
        try {
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-bell-notification-933.mp3');
            audio.volume = 0.3;
            audio.play();
        } catch (e) {
            console.log('Notification sound error:', e);
        }

        // Auto-hide after 5 seconds
        setTimeout(() => {
            alert.classList.remove('show');
        }, 5000);

        // Update UI
        if (currentFilter === 'all' || currentFilter === 'pending') {
            renderOrders(currentFilter === 'all' ? orders :
                orders.filter(o => o.status === currentFilter));
        }

        updateStats();
    }

    // Show toast notification
    function showToast(message, type = 'success') {
        // Remove existing toasts
        document.querySelectorAll('.toast').forEach(toast => toast.remove());

        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `
            <div class="toast-icon">
                <i class="fas fa-${type === 'success' ? 'check' : 'exclamation'}"></i>
            </div>
            <div>${message}</div>
        `;

        document.body.appendChild(toast);

        // Auto-remove after 3 seconds
        setTimeout(() => {
            if (toast.parentNode) {
                toast.remove();
            }
        }, 3000);
    }

    // Update order statuses (simulated)
    function updateOrderStatuses() {
        // Randomly update some order statuses
        orders.forEach(order => {
            if (order.status === 'preparing' && Math.random() > 0.7) {
                order.status = 'assigned';
                order.rider = riders[Math.floor(Math.random() * riders.length)].name;
            } else if (order.status === 'in-transit' && Math.random() > 0.8) {
                order.status = 'delivered';
                delete order.eta;
            }
        });

        if (currentFilter === 'all') {
            renderOrders(orders);
        } else {
            renderOrders(orders.filter(o => o.status === currentFilter));
        }

        updateStats();
    }

    // Setup event listeners
    function setupEventListeners() {
        // Close modal on overlay click
        document.getElementById('assignRiderModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('assignRiderModal')) {
                closeAssignModal();
            }
        });

        // Close new order alert on click
        document.getElementById('newOrderAlert').addEventListener('click', () => {
            document.getElementById('newOrderAlert').classList.remove('show');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeAssignModal();
            }
            if (e.key === 'r' && e.ctrlKey) {
                e.preventDefault();
                refreshOrders();
            }
        });
    }

    // Toggle user menu (placeholder)
    function toggleUserMenu() {
        showToast('User menu would open here', 'success');
    }
</script>
</body>
</html>
