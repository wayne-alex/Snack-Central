<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password 🍔</title>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">


    <style>
        :root {
            --primary-green: #10B981;
            --primary-orange: #F59E0B;
            --dark-text: #1F2937;
            --light-cream: #FEFCE8;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--light-cream);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-green), var(--primary-orange));
            color: white;
            padding: 25px;
            text-align: center;
        }

        .card-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .card-body {
            padding: 30px;
            color: var(--dark-text);
        }

        .card-body h2 {
            margin-top: 0;
            color: var(--primary-green);
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #D1D5DB;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-green), var(--primary-orange));
            border: none;
            color: white;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.95;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            color: #DC2626;
        }

        .success {
            color: #059669;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #9CA3AF;
            background: #1F2937;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <h1>🍔 SnackCentral</h1>
        <p>Reset Your Password</p>
    </div>

    <div class="card-body">
        <h2>Create a new password</h2>
        <p>Please enter your new password below.</p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" name="password" id="password" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" required minlength="6">
            </div>

            <button type="submit" class="btn">Reset Password 🔐</button>
        </form>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="message success">{{ success }}</div>
        {% endif %}
    </div>

    <div class="footer">
        © 2025 SnackCentral • 🍕 🍔 🍟 🌮 🥤
    </div>
</div>

</body>
</html>
