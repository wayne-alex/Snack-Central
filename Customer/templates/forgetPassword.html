<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack Central - Login & Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #10B981;
            --primary-orange: #F59E0B;
            --accent-blue: #1E40AF;
            --light-cream: #FEFCE8;
            --dark-text: #1F2937;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--light-cream) 0%, #fff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating Food Background */
        .floating-food {
            position: fixed;
            font-size: 3rem;
            opacity: 0.1;
            animation: float 20s infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-100px) rotate(90deg);
            }
            50% {
                transform: translateY(-50px) rotate(180deg);
            }
            75% {
                transform: translateY(-150px) rotate(270deg);
            }
        }

        .floating-food:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-food:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 3s;
        }

        .floating-food:nth-child(3) {
            top: 60%;
            left: 5%;
            animation-delay: 6s;
        }

        .floating-food:nth-child(4) {
            top: 70%;
            right: 10%;
            animation-delay: 9s;
        }

        .floating-food:nth-child(5) {
            top: 40%;
            left: 80%;
            animation-delay: 12s;
        }

        /* Auth Container */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 30px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-green), var(--primary-orange));
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo i {
            font-size: 4rem;
            color: var(--primary-green);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .logo h2 {
            color: var(--primary-green);
            font-weight: bold;
            margin-top: 1rem;
            font-size: 2rem;
        }

        .logo p {
            color: #6B7280;
            font-size: 0.9rem;
        }

        /* Form Styles */
        .form-label {
            color: var(--dark-text);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-control {
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            padding: 0.85rem 1rem;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            outline: none;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            font-size: 1.1rem;
            z-index: 10;
        }

        .form-control.with-icon {
            padding-left: 45px;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9CA3AF;
            font-size: 1.1rem;
            z-index: 10;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: var(--primary-green);
        }

        /* Buttons */
        .btn-auth {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-green), var(--primary-orange));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 1.5rem;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4);
        }

        .btn-auth:active {
            transform: translateY(0);
        }

        .btn-auth.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-auth .btn-text {
            display: inline-block;
            transition: opacity 0.3s;
        }

        .btn-auth.loading .btn-text {
            opacity: 0;
        }

        /* Loading Animation - Phone with Bouncing Burger */
        .loading-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn-auth.loading .loading-container {
            display: flex;
        }

        .phone-icon {
            font-size: 2rem;
            color: white;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        .burger-bounce {
            font-size: 1.5rem;
            animation: burgerBounce 0.6s infinite;
        }

        @keyframes burgerBounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* Links */
        .auth-link {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .auth-link:hover {
            color: var(--primary-orange);
            text-decoration: underline;
        }

        .forgot-password {
            text-align: right;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .switch-form {
            text-align: center;
            margin-top: 2rem;
            color: #6B7280;
        }

        /* Toggle between Login and Signup */
        .form-section {
            display: none;
            animation: fadeIn 0.5s;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0;
            color: #9CA3AF;
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E5E7EB;
        }

        .divider span {
            padding: 0 1rem;
        }

        /* Success Message */
        .success-message {
            background: linear-gradient(135deg, #D1FAE5, #A7F3D0);
            border: 2px solid var(--primary-green);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: none;
            animation: slideDown 0.5s;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-message.show {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .success-message i {
            font-size: 1.5rem;
            color: var(--primary-green);
        }

        /* Error Message */
        .error-message {
            background: #FEE2E2;
            border: 2px solid #EF4444;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: none;
            animation: shake 0.5s;
        }

        .error-message.show {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .error-message i {
            font-size: 1.5rem;
            color: #EF4444;
        }

        /* Back to Home */
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .back-home a {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--dark-text);
            text-decoration: none;
            padding: 0.7rem 1.5rem;
            background: white;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            font-weight: 600;
        }

        .back-home a:hover {
            transform: translateX(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* Responsive */
        @media (max-width: 576px) {
            .auth-card {
                padding: 2rem 1.5rem;
                border-radius: 20px;
            }

            .logo h2 {
                font-size: 1.5rem;
            }

            .logo i {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
<!-- Floating Food Background -->
<div class="floating-food">🍕</div>
<div class="floating-food">🍔</div>
<div class="floating-food">🍟</div>
<div class="floating-food">🥤</div>
<div class="floating-food">🌮</div>


<!-- Auth Container -->
<div class="auth-container">
    <div class="auth-card">
        <!-- Logo -->
        <div class="logo">
            <i class="fas fa-burger"></i>
            <h2>Snack Central</h2>
            <p id="auth-subtitle">Welcome back! Sign in to continue</p>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i>
            <div>
                <strong>Success!</strong>
                <p class="mb-0" id="successText">Account created successfully!</p>
            </div>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <div>
                <strong>Error!</strong>
                <p class="mb-0" id="errorText">Invalid credentials. Please try again.</p>
            </div>
        </div>
        <div class="form-section" id="forgotPasswordForm">
            <form id="forgotPasswordFormElement">
                <p class="text-center mb-4" style="color: #6B7280;">
                    Enter your email address and we'll send you a verification code to reset your password.
                </p>

                <!-- Phone Number -->
                <div class="mb-3">
                    <label for="forgotPhone" class="form-label">Email Address</label>
                    <div class="input-group">
                        <i class="input-icon fas fa-envelope"></i>
                        <input type="email" class="form-control with-icon" id="forgotPhone"
                               placeholder="john@example.com">
                    </div>
                </div>

                <!-- Reset Button -->
                <button type="submit" class="btn btn-auth" id="forgotBtn">
                    <span class="btn-text">Send Reset Code</span>
                    <div class="loading-container">
                        <i class="phone-icon fas fa-mobile-alt"></i>
                        <span class="burger-bounce">🍔</span>
                    </div>
                </button>
            </form>

            <!-- Back to Login -->
            <div class="switch-form">
                <a href="#" class="auth-link" >
                    <i class="fas fa-arrow-left"></i> Back to Log In
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('forgotPasswordForm').classList.add('active');
    document.getElementById('auth-subtitle').textContent = 'Reset Your Password';
    hideMessages();

    // Toggle Password Visibility
    function togglePassword(inputId, iconElement) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            iconElement.classList.remove('fa-eye');
            iconElement.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            iconElement.classList.remove('fa-eye-slash');
            iconElement.classList.add('fa-eye');
        }
    }

    // Switch Between Forms
    function switchForm(event, formType) {
        event.preventDefault();

        // Hide all forms
        document.querySelectorAll('.form-section').forEach(section => {
            section.classList.remove('active');
        });

        // Hide messages
        hideMessages();

        // Show selected form and update subtitle
        if (formType === 'login') {
            document.getElementById('loginForm').classList.add('active');
            document.getElementById('auth-subtitle').textContent = 'Welcome back! Sign in to continue';
        } else if (formType === 'signup') {
            document.getElementById('signupForm').classList.add('active');
            document.getElementById('auth-subtitle').textContent = 'Create your account to get started';
        }
    }


    // Show/Hide Messages
    function showSuccess(message) {
        const successDiv = document.getElementById('successMessage');
        const successText = document.getElementById('successText');
        successText.textContent = message;
        successDiv.classList.add('show');

        setTimeout(() => {
            successDiv.classList.remove('show');
        }, 5000);
    }

    function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        errorText.textContent = message;
        errorDiv.classList.add('show');

        setTimeout(() => {
            errorDiv.classList.remove('show');
        }, 5000);
    }

    function hideMessages() {
        document.getElementById('successMessage').classList.remove('show');
        document.getElementById('errorMessage').classList.remove('show');
    }

    // Login Form Handler
    document.getElementById('loginFormElement').addEventListener('submit', function (e) {
        e.preventDefault();
        hideMessages();

        const phone = document.getElementById('loginPhone').value;
        const password = document.getElementById('loginPassword').value;
        const loginBtn = document.getElementById('loginBtn');

        // Validate phone number
        if (!/^[0-9]{10}$/.test(phone)) {
            showError('Please enter a valid 10-digit phone number');
            return;
        }

        // Show loading state
        loginBtn.classList.add('loading');

        // Simulate API call
        setTimeout(() => {
            loginBtn.classList.remove('loading');

            // Simulate successful login
            // In real implementation, send data to Django backend
            showSuccess('Login successful! Redirecting...');

            setTimeout(() => {
                console.log('Login data:', {phone, password});
                // window.location.href = '/menu'; // Redirect to menu page
            }, 1500);
        }, 2000);
    });

    // Signup Form Handler
    document.getElementById('signupFormElement').addEventListener('submit', function (e) {
        e.preventDefault();
        hideMessages();

        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const phone = document.getElementById('signupPhone').value;
        const password = document.getElementById('signupPassword').value;
        const confirmPassword = document.getElementById('signupConfirmPassword').value;
        const signupBtn = document.getElementById('signupBtn');

        // Validate phone number
        if (!/^[0-9]{10}$/.test(phone)) {
            showError('Please enter a valid 10-digit phone number');
            return;
        }

        // Validate passwords match
        if (password !== confirmPassword) {
            showError('Passwords do not match');
            return;
        }

        // Validate password length
        if (password.length < 6) {
            showError('Password must be at least 6 characters long');
            return;
        }

        // Show loading state
        signupBtn.classList.add('loading');

        // Simulate API call
        setTimeout(() => {
            signupBtn.classList.remove('loading');

            // Simulate successful signup
            showSuccess('Account created successfully! Please sign in.');

            setTimeout(() => {
                console.log('Signup data:', {name, email, phone, password});
                switchForm(new Event('click'), 'login');
            }, 2000);
        }, 2500);
    });

    // Forgot Password Form Handler
    document.getElementById('forgotPasswordFormElement').addEventListener('submit', function (e) {
        e.preventDefault();
        hideMessages();

        const phone = document.getElementById('forgotPhone').value;
        const forgotBtn = document.getElementById('forgotBtn');

        // Validate phone number
        if (!/^[0-9]{10}$/.test(phone)) {
            showError('Please enter a valid 10-digit phone number');
            return;
        }

        // Show loading state
        forgotBtn.classList.add('loading');

        // Simulate API call
        setTimeout(() => {
            forgotBtn.classList.remove('loading');

            // Simulate successful reset code sent
            showSuccess('Reset code sent to your phone via SMS!');

            setTimeout(() => {
                console.log('Password reset for:', phone);
                // In real app, show verification code input
            }, 1500);
        }, 2000);
    });

    // Phone number formatting (adds spacing for readability)
    document.querySelectorAll('input[type="tel"]').forEach(input => {
        input.addEventListener('input', function (e) {
            // Remove non-digits
            let value = e.target.value.replace(/\D/g, '');
            // Limit to 10 digits
            value = value.substring(0, 10);
            e.target.value = value;
        });
    });

    // Add enter key support for form submission
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const form = this.closest('form');
                if (form) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });
    });
</script>
</body>
</html>
